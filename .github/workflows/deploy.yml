name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_REF: yylsqqajnfvkodspejpg

jobs:
  supabase:
    runs-on: ubuntu-latest
    # Same environment as the site, so the token is found whether it was saved for the repo or for this environment.
    environment: github-pages
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Supabase token
        id: token
        run: echo "present=${{ env.SUPABASE_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Set up the database
        if: steps.token.outputs.present == 'true'
        run: |
          # Only the kind of token is shown, never the token itself.
          echo "Token starts with ${SUPABASE_ACCESS_TOKEN:0:4}, ${#SUPABASE_ACCESS_TOKEN} characters"
          echo "Project lookup: $(curl -s -o /dev/null -w '%{http_code}' https://api.supabase.com/v1/projects/$PROJECT_REF -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          echo "Functions list: $(curl -s -o /dev/null -w '%{http_code}' https://api.supabase.com/v1/projects/$PROJECT_REF/functions -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          jq -Rs '{query: .}' supabase/setup.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json)
          cat /tmp/out.json; echo
          test "$code" -lt 300
      - name: Deploy the edge functions
        if: always() && steps.token.outputs.present == 'true'
        run: npx --yes supabase@latest functions deploy read remind --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
