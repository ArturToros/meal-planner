name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_REF: yylsqqajnfvkodspejpg

jobs:
  supabase:
    runs-on: ubuntu-latest
    # Same environment as the site, so the token is found whether it was saved for the repo or for this environment.
    environment: github-pages
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Supabase token
        id: token
        run: echo "present=${{ env.SUPABASE_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Set up the database
        if: steps.token.outputs.present == 'true'
        run: |
          jq -Rs '{query: .}' supabase/setup.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json)
          cat /tmp/out.json; echo
          test "$code" -lt 300
      - name: Deploy the edge functions
        if: steps.token.outputs.present == 'true'
        run: npx --yes supabase@latest functions deploy read remind --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Check that everything is in place
        if: steps.token.outputs.present == 'true'
        run: |
          api=https://api.supabase.com/v1/projects/$PROJECT_REF
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          q() { jq -n --arg q "$1" '{query: $q}' | curl -sS -X POST "$api/database/query" -H "$auth" -H 'Content-Type: application/json' --data @-; echo; }
          echo "Tables:";      q "select table_name from information_schema.tables where table_schema='public' order by 1"
          echo "Users:";       q "select count(*) as users from auth.users"
          echo "Reminder job:"; q "select jobname, schedule from cron.job"
          echo "Secrets set:"; curl -sS "$api/secrets" -H "$auth" | jq -r '.[].name' | grep -v '^SUPABASE_' || true
          sleep 5
          for f in read remind; do echo "$f answers: $(curl -sS -X POST https://$PROJECT_REF.supabase.co/functions/v1/$f -H 'Content-Type: application/json' -d '{}')"; done

  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
